[project]
name = "ml"
version = "0.1.0"
description = "ML service: sentiment and doomscroll models"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.4",
    "transformers>=5.17.0",
    "datasets>=3.0",
    "scikit-learn>=1.5",
    "pandas>=2.2",
    "pyarrow>=17.0",
    "accelerate>=1.0",
    "matplotlib>=3.9",
    "seaborn>=0.13",
    "fastapi>=0.115",
    "uvicorn[standard]>=0.30",
    "pydantic-settings>=2.4",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[[tool.uv.index]]
name = "pytorch"
url = "https://download.pytorch.org/whl/cu124"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch" }

[tool.hatch.build.targets.wheel]
packages = ["src/ml"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
markers = ["integration: hits network/HuggingFace"]

[tool.ruff]
line-length = 100
target-version = "py311"